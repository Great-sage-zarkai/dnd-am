<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Othran Vel · Campaña</title>
<link rel="icon" href="img/othran vel logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #15120e; --panel: #1e1a15; --panel2: #27221b; --line: #3a3228; --text: #e9e0cf; --dim: #a39782;
  --accent: #d9a54a; --accent2: #8fbf9f; --danger: #d0675a; --secret: #a98ad8; --read: #2a2419; --readline: #8a6a2e;
  --pin-town: #d9a54a; --pin-danger: #d0675a; --pin-secret: #a98ad8; --pin-other: #5fb3a8; --pin-room: #c9c1b0;
  --shadow: 0 4px 18px rgba(0,0,0,.45);
}
:root[data-theme="light"] {
  --bg: #efe6d2; --panel: #f8f2e4; --panel2: #efe5cf; --line: #d8c9a8; --text: #2d2418; --dim: #77684f;
  --accent: #9a6514; --accent2: #3f7a57; --danger: #a8402f; --secret: #6b4ca5; --read: #f3e7c8; --readline: #b8893a;
  --pin-town: #b77a17; --pin-danger: #b0442f; --pin-secret: #7650b8; --pin-other: #2f8378; --pin-room: #6c6252;
  --shadow: 0 4px 14px rgba(60,40,10,.18);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.app { display: grid; grid-template-rows: 54px 1fr; height: 100vh; }

/* Cabecera */
header { display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
header img { height: 36px; width: 36px; object-fit: cover; border-radius: 50%; }
.brand h1 { font: 700 18px Cinzel, serif; margin: 0; letter-spacing: .04em; color: var(--accent); }
.brand small { color: var(--dim); font-size: 11px; }
.search-btn { margin-left: 24px; flex: 0 1 360px; display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--dim); text-align: left; }
.search-btn kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.spacer { flex: 1; }
.hbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.hbtn.on { background: var(--accent); color: #1b1307; border-color: var(--accent); font-weight: 600; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 220px; z-index: 50; display: none; padding: 4px; }
.menu-list.open { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; }
.menu-list button:hover { background: var(--panel2); }

/* Columnas */
main { display: grid; grid-template-columns: 290px 1fr 420px; min-height: 0; }
aside, .detail { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
aside { border-right: 1px solid var(--line); }
.detail { border-left: 1px solid var(--line); overflow-y: auto; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 10px 4px; color: var(--dim); border-bottom: 2px solid transparent; font-size: 13px; }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.list { overflow-y: auto; flex: 1; padding: 6px 0 20px; }
.list-tools { padding: 8px 10px; display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.list-tools input { flex: 1; }
input, textarea, select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
textarea { width: 100%; resize: vertical; min-height: 60px; font-family: inherit; }
.group-title { font: 600 11px Inter; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 12px 14px 4px; }

/* Árbol */
.node { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 0; cursor: pointer; border-left: 3px solid transparent; white-space: nowrap; }
.node:hover { background: var(--panel2); }
.node.sel { background: var(--panel2); border-left-color: var(--accent); color: var(--accent); }
.node .tw { width: 16px; text-align: center; color: var(--dim); font-size: 10px; flex: none; }
.node .nm { overflow: hidden; text-overflow: ellipsis; }
.node .badge { font-size: 10px; color: var(--dim); }
.node.secret .nm { color: var(--secret); }

/* Filas de personajes */
.row { display: flex; align-items: center; gap: 10px; padding: 6px 14px; cursor: pointer; border-left: 3px solid transparent; }
.row:hover { background: var(--panel2); }
.row.sel { background: var(--panel2); border-left-color: var(--accent); }
.row .meta { min-width: 0; }
.row .meta b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta span { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.dead b { text-decoration: line-through; color: var(--dim); }
.av { width: 34px; height: 34px; border-radius: 50%; flex: none; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font: 600 12px Inter; color: var(--accent); object-fit: cover; object-position: top; }
.av.pc { border-color: var(--accent2); color: var(--accent2); }

/* Mapa */
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #0b0a08; }
:root[data-theme="light"] .center { background: #d9ccb0; }
.mapbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.crumbs { flex: 1; font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs a { text-decoration: none; color: var(--dim); }
.crumbs a:hover { color: var(--accent); }
.crumbs b { color: var(--text); }
.mbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; min-width: 30px; height: 28px; padding: 0 8px; }
.mbtn.on { border-color: var(--accent); color: var(--accent); }
.viewport { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none; }
.viewport.dragging { cursor: grabbing; }
.viewport.placing { cursor: crosshair; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.stage.anim { transition: transform .35s ease; }
.stage img.mapimg { display: block; user-select: none; -webkit-user-drag: none; box-shadow: 0 0 40px rgba(0,0,0,.6); }
.nomap { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); text-align: center; padding: 30px; }
.pin { position: absolute; transform: translate(-50%, -50%) scale(var(--inv, 1)); display: flex; align-items: center; gap: 4px; }
.pin .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--c, var(--pin-other)); border: 2px solid #fff8e6; box-shadow: 0 2px 6px rgba(0,0,0,.6); display: grid; place-items: center; font-size: 10px; color: #1b1307; font-weight: 700; cursor: pointer; transition: transform .12s; }
.pin.secret .dot { border-style: dashed; border-color: #f0e6ff; }
.pin:hover .dot { transform: scale(1.25); }
.pin.sel .dot { transform: scale(1.45); box-shadow: 0 0 0 4px rgba(217,165,74,.55), 0 2px 8px rgba(0,0,0,.7); }
.pin .lbl { position: absolute; left: 26px; top: 50%; transform: translateY(-50%); background: rgba(20,16,10,.88); color: #f3e9d4; padding: 2px 7px; border-radius: 5px; font-size: 12px; white-space: nowrap; pointer-events: none; display: none; }
.pin:hover .lbl, .pin.sel .lbl, .labels .pin .lbl { display: block; }
.pin.hasmap .dot::after { content: "⤵"; position: absolute; right: -9px; top: -9px; font-size: 11px; background: var(--panel); color: var(--accent); border-radius: 50%; width: 15px; height: 15px; display: grid; place-items: center; border: 1px solid var(--accent); }
.edit .pin .dot { cursor: move; }
.token { position: absolute; transform: translate(-50%, -50%) scale(var(--inv, 1)); cursor: pointer; z-index: 2; }
.token .av { width: 38px; height: 38px; border: 3px solid var(--accent2); box-shadow: 0 2px 8px rgba(0,0,0,.7); transition: transform .12s; }
.token:hover .av { transform: scale(1.15); }
.token.sel .av { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(217,165,74,.55), 0 2px 8px rgba(0,0,0,.7); }
.token .lbl { position: absolute; left: 46px; top: 50%; transform: translateY(-50%); background: rgba(20,16,10,.92); color: #f3e9d4; padding: 4px 8px; border-radius: 6px; font-size: 12px; width: max-content; max-width: 240px; pointer-events: none; display: none; }
.token:hover .lbl, .token.sel .lbl { display: block; }
.edit .token { cursor: move; }
.token.vecino .av { width: 28px; height: 28px; border: 2px dashed #9a9080; opacity: .92; }
.token.vecino .lbl i { color: #b9ad97; }
.av.vecino { border: 2px dashed #9a9080; }
.token.enemigo .av, .av.enemigo { border-color: var(--danger); }
.token.enemigo .lbl i { color: #e7a093; }
.tag.enemy { color: var(--danger); border-color: var(--danger); }
.row.vecino .meta b { font-weight: 500; }
.tag.vecino { border-style: dashed; }
.group-title.toggle { cursor: pointer; }
.group-title.toggle:hover { color: var(--accent); }
.times { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.times button { background: var(--panel2); border: 0; border-right: 1px solid var(--line); height: 28px; padding: 0 8px; font-size: 14px; }
.times button:last-child { border-right: 0; }
.times button.on { background: var(--accent); }
.away { color: var(--dim); font-style: italic; }
.scene { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 8px; background: var(--panel2); margin-bottom: 6px; cursor: pointer; }
.scene:hover { outline: 1px solid var(--accent); }
.scene .av { width: 40px; height: 40px; }
.scene b { display: block; }
.scene span { font-size: 13px; color: var(--dim); }
.doing { background: var(--panel2); border-left: 3px solid var(--accent2); border-radius: 0 8px 8px 0; padding: 8px 12px; margin: 0 0 14px; }
.doing h4 { margin: 0 0 3px; font: 600 11px Inter; text-transform: uppercase; letter-spacing: .08em; color: var(--accent2); }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 14px; box-shadow: var(--shadow); font-size: 13px; z-index: 5; }

/* Ficha */
.card { padding: 18px 20px 40px; }
.hero { width: 100%; max-height: 240px; object-fit: cover; object-position: top; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 14px; display: block; cursor: zoom-in; }
.card h2 { font: 700 22px/1.2 Cinzel, serif; margin: 0 0 4px; color: var(--accent); }
.sub { color: var(--dim); font-size: 13px; margin-bottom: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
.tag.secret { color: var(--secret); border-color: var(--secret); }
.tag.dead { color: var(--danger); border-color: var(--danger); }
.tag.ok { color: var(--accent2); border-color: var(--accent2); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; font-size: 13px; }
.btn.primary { background: var(--accent); color: #1b1307; border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.read { background: var(--read); border-left: 3px solid var(--readline); border-radius: 0 8px 8px 0; padding: 12px 14px; font: italic 17px/1.5 "Crimson Pro", Georgia, serif; margin: 6px 0 14px; }
.read .h { font: 600 11px Inter; font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--readline); display: block; margin-bottom: 4px; }
.quote { font: italic 17px/1.4 "Crimson Pro", Georgia, serif; color: var(--accent); margin: 0 0 14px; }
.f { margin: 0 0 12px; }
.f h4 { margin: 0 0 3px; font: 600 11px Inter; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.f div { white-space: normal; }
.f.voice div { background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
.dmbox { border: 1px dashed var(--secret); border-radius: 10px; padding: 10px 12px 2px; margin: 14px 0; }
.dmbox > .h { font: 600 11px Inter; letter-spacing: .08em; text-transform: uppercase; color: var(--secret); margin-bottom: 8px; display: flex; justify-content: space-between; cursor: pointer; }
.dmbox.closed > :not(.h) { display: none; }
.tbd { color: var(--dim); opacity: .7; font-style: italic; }
.lk { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; }
.lk.npc { color: var(--accent2); border-bottom-color: var(--accent2); }
.lk.fac { color: var(--secret); border-bottom-color: var(--secret); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px 3px 3px; cursor: pointer; font-size: 13px; }
.chip:hover { border-color: var(--accent); }
.chip .av { width: 24px; height: 24px; font-size: 10px; }
.chip small { color: var(--dim); }
.chip.plain { padding: 3px 10px; }
.missing { font-size: 12px; color: var(--dim); margin-top: 20px; border-top: 1px solid var(--line); padding-top: 10px; }
.form label { display: block; font: 600 11px Inter; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 10px 0 3px; }
.form input[type=text], .form select { width: 100%; }
.form .chk { display: flex; gap: 16px; margin-top: 10px; }
.form .chk label { display: flex; gap: 6px; align-items: center; text-transform: none; font: 13px Inter; color: var(--text); margin: 0; }
.empty { color: var(--dim); padding: 40px 20px; text-align: center; }

/* Buscador y visor de imagen */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 100; }
.overlay.open { display: block; }
.palette { width: min(620px, 92vw); margin: 10vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 16px; font-size: 16px; background: var(--panel); outline: none; }
.results { max-height: 55vh; overflow-y: auto; }
.res { display: flex; gap: 10px; align-items: center; padding: 8px 14px; cursor: pointer; }
.res.active, .res:hover { background: var(--panel2); }
.res .k { font-size: 11px; color: var(--dim); margin-left: auto; }
.lightbox { place-items: center; cursor: zoom-out; }
.lightbox.open { display: grid; }
.lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <img id="logo" alt="">
    <div class="brand"><h1 id="title">Othran Vel</h1><small id="group"></small></div>
    <button class="search-btn" id="openSearch">🔍 Buscar NPC, lugar, misión… <kbd>Ctrl K</kbd></button>
    <div class="spacer"></div>
    <button class="hbtn" id="editToggle" title="Activa el modo edición para mover pins y editar fichas">✏️ Editar</button>
    <button class="hbtn" id="themeToggle" title="Tema claro / oscuro">☾</button>
    <div class="menu">
      <button class="hbtn" id="menuBtn">⋯</button>
      <div class="menu-list" id="menuList">
        <button data-act="export">💾 Exportar campaña (copia de seguridad)</button>
        <button data-act="import">📂 Importar campaña…</button>
        <button data-act="reset">↺ Restaurar datos del Word</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </header>
  <main>
    <aside>
      <div class="tabs" id="tabs">
        <button data-tab="loc" class="active">Lugares</button>
        <button data-tab="npc">Personajes</button>
        <button data-tab="fac">Facciones</button>
        <button data-tab="quest">Misiones</button>
      </div>
      <div class="list-tools"><input id="filter" placeholder="Filtrar…"><button class="btn" id="addBtn" title="Añadir" hidden>＋</button></div>
      <div class="list" id="list"></div>
    </aside>
    <section class="center">
      <div class="mapbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="times" id="times" title="Momento del día"></div>
        <button class="mbtn" id="vecinosBtn" title="Mostrar / ocultar vecinos (relleno)">🏘</button>
        <button class="mbtn" id="upBtn" title="Subir al mapa superior">⬆</button>
        <button class="mbtn" id="labelsBtn" title="Mostrar todas las etiquetas">Aa</button>
        <button class="mbtn" id="tokensBtn" title="Mostrar / ocultar personajes en el plano">👥</button>
        <button class="mbtn" id="zoomOut" title="Alejar">−</button>
        <button class="mbtn" id="zoomIn" title="Acercar">+</button>
        <button class="mbtn" id="fitBtn" title="Encajar mapa">⤢</button>
      </div>
      <div class="viewport" id="viewport"><div class="stage" id="stage"></div></div>
    </section>
    <div class="detail" id="detail"></div>
  </main>
</div>
<div class="overlay" id="searchOv"><div class="palette"><input id="searchIn" placeholder="Escribe un nombre…" autocomplete="off"><div class="results" id="results"></div></div></div>
<div class="overlay lightbox" id="lightbox"><img alt=""></div>

<script src="data/seed.js"></script>
<script src="data/images.js" onerror="window.IMAGES = {}"></script>
<script>
const STORE = 'othranvel.campaign.v1';
const PREFS = 'othranvel.prefs.v1';
const TBD = '[POR DEFINIR]';

let db = load();
let prefs = Object.assign({ theme: 'dark', tab: 'loc', labels: false, time: 'tarde', open: ['mundo', 'othran-vel', 'ethar'] }, safeGet(PREFS));
let route = { kind: 'loc', id: db.start, map: db.start };
let editMode = false, editing = false, placing = null;
const openNodes = new Set(prefs.open);

function safeGet(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } }
function load() {
  const saved = safeGet(STORE);
  if (!saved.locations) return structuredClone(window.SEED);
  // Suma lo nuevo del seed (fichas y campos) sin pisar lo editado ni resucitar lo borrado
  const gone = new Set(saved.deleted || []);
  for (const kind of ['locations', 'npcs', 'factions', 'quests']) {
    saved[kind] ??= {};
    for (const [id, o] of Object.entries(window.SEED[kind])) {
      if (gone.has(id)) continue;
      if (!saved[kind][id]) saved[kind][id] = structuredClone(o);
      else for (const [k, v] of Object.entries(o)) if (!(k in saved[kind][id])) saved[kind][id][k] = structuredClone(v);
    }
  }
  // Parches del seed: campos que se sobrescriben aunque ya estuvieran guardados (cambios de diseño)
  for (const p of window.SEED.patches || []) {
    if (p.v <= (saved.patchLevel || 0)) continue;
    const src = window.SEED[p.kind]?.[p.id], dst = saved[p.kind]?.[p.id];
    if (src && dst) for (const k of p.keys) { if (k in src) dst[k] = structuredClone(src[k]); else delete dst[k]; }
  }
  saved.patchLevel = Math.max(saved.patchLevel || 0, ...(window.SEED.patches || []).map(p => p.v));
  return saved;
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) { alert('No se pudo guardar: ' + e.message); } }
function savePrefs() { prefs.open = [...openNodes]; try { localStorage.setItem(PREFS, JSON.stringify(prefs)); } catch {} }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const src = p => p && !p.startsWith('data:') ? encodeURI(p) : p;
// Imagen de la ficha, o la detectada en img/npcs|lugares/<id>.* (data/images.js)
const imgOf = (o, kind) => o.image || (window.IMAGES?.[kind === 'loc' ? 'locations' : 'npcs'] || {})[o.id];
const isTbd = v => !v || !String(v).trim() || String(v).trim() === TBD;
const plainName = n => n.replace(/\s*«[^»]*»/g, '').trim();
const initials = n => plainName(n).split(/\s+/).filter(w => /^\p{Lu}/u.test(w)).slice(0, 2).map(w => w[0]).join('') || n[0];

/* ---------- Modelo ---------- */
const L = id => db.locations[id];
const children = id => Object.values(db.locations).filter(l => l.parent === id);
function ancestors(id) { const a = []; let l = L(id); while (l && l.parent) { l = L(l.parent); if (l) a.unshift(l); } return a; }
function mapHost(id) { let l = L(id); while (l) { if (l.map) return l.id; l = L(l.parent); } return null; }
// Mapa en el que aparece el pin de un lugar (o, sin pin, el mapa más cercano)
function mapForPin(id) { const l = L(id); if (!l) return null; return l.pin && l.parent ? mapHost(l.parent) : mapHost(id); }
function subtree(id) { const out = [id]; for (const c of children(id)) out.push(...subtree(c.id)); return out; }

function typeIcon(t = '') {
  t = t.toLowerCase();
  const m = [['estancia', '🚪'], ['mundo', '🌍'], ['región', '🗺️'], ['ciudad', '🏰'], ['pueblo', '🏘️'], ['mazmorra', '⛓️'], ['ruina', '🏚️'], ['bosque', '🌲'],

  return [+Math.min(Math.max(x, 0), 1).toFixed(4), +Math.min(Math.max(y, 0), 1).toFixed(4)];
}
function toast(msg) { hideToast(); vp.insertAdjacentHTML('beforeend', `<div class="toast" id="toast">${msg}</div>`); }
function hideToast() { $('#toast')?.remove(); }
window.addEventListener('resize', () => fitView(false));

/* ---------- Fichas ---------- */
const LOC_FIELDS = [['read', 'Descripción para leer'], ['ambience', 'Ambiente'], ['where', 'Ubicación aproximada'], ['faction', 'Facción o gobierno'],
  ['dm', 'Notas del máster'], ['npcs', 'NPCs (texto del Word)'], ['items', 'Objetos, precios, servicios'], ['hooks', 'Ganchos / pistas'], ['tone', 'Tono'], ['situation', 'Situación actual']];
const NPC_FIELDS = [['doing', 'Qué está haciendo ahora'], ['sheet', 'Ficha de juego'], ['race', 'Raza'], ['role', 'Rol / ocupación'], ['location', 'Dónde se encuentra'], ['faction', 'Facción'], ['status', 'Estado'], ['known', '¿Lo conocen los jugadores?'],
  ['quote', 'Frase típica'], ['look', 'Aspecto físico'], ['personality', 'Personalidad'], ['voice', 'Voz y gestos'], ['wants', 'Qué quiere'], ['knows', 'Qué sabe'],
  ['secrets', 'Secretos'], ['pcRel', 'Relación con los jugadores'], ['npcRel', 'Relación con otros NPCs']];
const FAC_FIELDS = [['desc', 'Descripción'], ['goals', 'Objetivos'], ['leader', 'Líder'], ['members', 'Miembros conocidos'], ['pcRel', 'Relación con los jugadores']];
const QUEST_FIELDS = [['giver', 'Quién la da'], ['where', 'Dónde'], ['status', 'Estado'], ['summary', 'Resumen'], ['dm', 'Notas del máster']];
const FIELDS = { loc: LOC_FIELDS, npc: NPC_FIELDS, fac: FAC_FIELDS, quest: QUEST_FIELDS };
const label = (kind, k) => FIELDS[kind].find(f => f[0] === k)?.[1] || k;

function current() { return { loc: db.locations, npc: db.npcs, fac: db.factions, quest: db.quests }[route.kind][route.id]; }
function field(kind, obj, k, cls = '') { return isTbd(obj[k]) ? '' : `<div class="f ${cls}"><h4>${label(kind, k)}</h4><div>${fmt(obj[k], obj.id)}</div></div>`; }
function missing(kind, obj, keys) {
  const m = keys.filter(k => isTbd(obj[k]) && (obj[k] !== undefined || kind !== 'loc')).map(k => label(kind, k));
  return m.length ? `<div class="missing">Por definir: ${m.join(', ')}</div>` : '';
}
function dmBox(inner, title = 'Solo máster') {
  if (!inner.trim()) return '';
  return `<div class="dmbox ${prefs.dmClosed ? 'closed' : ''}"><div class="h" data-dmtoggle>🔒 ${title}<span>${prefs.dmClosed ? 'mostrar' : 'ocultar'}</span></div>${inner}</div>`;
}

function renderDetail() {
  const el = $('#detail'), o = current();
  if (!o) { el.innerHTML = '<div class="empty">Elige algo en la lista o en el mapa</div>'; return; }
  if (editing) { el.innerHTML = editForm(route.kind, o); return; }
  el.innerHTML = `<div class="card">${({ loc: locCard, npc: npcCard, fac: facCard, quest: questCard })[route.kind](o)}</div>`;
}
function editActions(kind, o) {
  if (!editMode) return '';
  let h = `<button class="btn primary" data-act="edit">✏️ Editar ficha</button>`;
  if (kind === 'loc') {
    h += `<button class="btn" data-act="addChild">＋ Sublugar</button><button class="btn" data-act="addNpcHere">＋ NPC aquí</button>`;
    if (o.parent && mapHost(o.parent)) h += `<button class="btn" data-act="place">📍 ${o.pin ? 'Recolocar' : 'Colocar'} en el mapa</button>`;
  }
  if (kind === 'npc' && route.map) {
    h += `<button class="btn" data-act="placeNpc">📍 Situar en «${esc(L(route.map).name)}»</button>`;
    if (now(o).spot) h += `<button class="btn" data-act="unplaceNpc">✕ Quitar del plano (${timeLabel(prefs.time).toLowerCase()})</button>`;
  }
  if (o.id !== 'mundo' && o.id !== db.start) h += `<button class="btn danger" data-act="delete">🗑 Borrar</button>`;
  return `<div class="actions">${h}</div>`;
}
function locCard(l) {
  const crumbs = ancestors(l.id).filter(a => a.id !== 'mundo').map(a => `<a class="lk" href="#/loc/${a.id}">${esc(a.name)}</a>`).join(' › ');
  const ids = new Set(subtree(l.id));
  const npcs = Object.values(db.npcs).filter(n => ids.has(npcLocation(n)));
  // NPCs mencionados en el texto del lugar que no tengan ubicación aquí
  const named = (l.npcs || '').split(/,(?![^(]*\))/).map(s => resolveName(s.replace(/\(.*?\)/g, '')))
    .filter(r => r && r.kind === 'npc' && !npcs.some(n => n.id === r.id)).map(r => db.npcs[r.id]);
  const kids = children(l.id);
  // escena según el momento del día: primero los principales, luego los vecinos
  const byTier = (a, b) => isVecino(a) - isVecino(b);
  const scene = npcs.filter(n => !isTbd(now(n).doing) && !now(n).away).sort(byTier);
  const rest = npcs.filter(n => isTbd(now(n).doing) || now(n).away).concat(named).sort(byTier);
  const chip = n => { const at = npcLocation(n); const sub = at && at !== l.id ? ` <small>· ${esc(L(at).name)}</small>` : ''; return `<span class="chip" data-npc="${n.id}">${avatar(n)}${esc(plainName(n.name))}${isDead(n) ? ' †' : ''}${sub}</span>`; };
  const enterBtn = l.map && route.map !== l.id ? `<button class="btn primary" data-act="enter">🗺 Abrir mapa de ${esc(l.name)}</button>` : '';
  const showOn = !l.map && l.pin && route.map !== mapForPin(l.id) ? `<button class="btn" data-act="show">📍 Ver en el mapa</button>` : '';
  return `${imgOf(l, 'loc') ? `<img class="hero" src="${src(imgOf(l, 'loc'))}" alt="" data-zoom>` : ''}
    <h2>${typeIcon(l.type)} ${esc(l.name)}</h2>
    <div class="sub">${esc(l.type || '')}${crumbs ? ' · ' + crumbs : ''}</div>
    <div class="tags">${l.visited ? '<span class="tag ok">Visitado</span>' : (l.id !== 'mundo' ? '<span class="tag">No visitado</span>' : '')}${l.secret ? '<span class="tag secret">🔒 Secreto</span>' : ''}${l.pin || l.id === 'mundo' || l.id === db.start ? '' : '<span class="tag">Sin pin</span>'}</div>
    <div class="actions">${enterBtn}${showOn}</div>${editActions('loc', l)}
    ${!isTbd(l.read) ? `<div class="read"><span class="h">📖 Leer en voz alta</span>${fmt(l.read, l.id)}</div>` : ''}
    ${field('loc', l, 'situation')}${field('loc', l, 'tone')}${field('loc', l, 'ambience')}
    ${scene.length ? `<div class="f"><h4>🎭 Qué está pasando aquí · ${TIMES.find(t => t[0] === prefs.time)[1]} ${timeLabel(prefs.time).toLowerCase()}</h4>${scene.map(n => { const at = npcLocation(n); return `<div class="scene" data-npc="${n.id}">${avatar(n)}<div><b>${esc(plainName(n.name))}${isVecino(n) ? ' <small style="color:var(--dim);font-weight:400;font-style:italic">vecino</small>' : ''}${at !== l.id ? ` <small style="color:var(--dim);font-weight:400">· ${esc(L(at).name)}</small>` : ''}</b><span>${esc(now(n).doing)}</span></div></div>`; }).join('')}</div>` : ''}
    ${rest.length ? `<div class="f"><h4>${scene.length ? 'También aquí' : 'Personajes aquí'} (${rest.length})</h4><div class="chips">${rest.map(chip).join('')}</div></div>` : ''}
    ${kids.length ? `<div class="f"><h4>Lugares dentro</h4><div class="chips">${kids.map(k => `<span class="chip plain" data-loc="${k.id}">${typeIcon(k.type)} ${esc(k.name)}</span>`).join('')}</div></div>` : ''}
    ${dmBox(field('loc', l, 'dm') + field('loc', l, 'hooks') + field('loc', l, 'items') + field('loc', l, 'faction') + field('loc', l, 'where'))}
    ${missing('loc', l, ['read', 'dm', 'hooks', 'items', 'faction'])}`;
}
function npcCard(n) {
  const at = npcLocation(n);
  return `${imgOf(n, 'npc') ? `<img class="hero" src="${src(imgOf(n, 'npc'))}" alt="" data-zoom>` : ''}
    <h2>${esc(n.name)}</h2>
    <div class="sub">${[n.race, n.role].filter(x => !isTbd(x)).map(esc).join(' · ')}</div>
    <div class="tags">${n.pc ? '<span class="tag ok">Personaje jugador</span>' : ''}${isVecino(n) ? '<span class="tag vecino">🏘 Vecino (relleno)</span>' : ''}${isEnemy(n) ? '<span class="tag enemy">⚔ Enemigo</span>' : ''}${!isTbd(n.sheet) ? `<span class="tag">📋 Ficha: ${esc(n.sheet)}</span>` : ''}${!isTbd(n.status) ? `<span class="tag ${isDead(n) ? 'dead' : ''}">${esc(n.status)}</span>` : ''}${!isTbd(n.known) && !n.pc ? `<span class="tag">Lo conocen: ${esc(n.known)}</span>` : ''}</div>
    <div class="actions">${at ? `<button class="btn" data-act="goLoc" data-id="${at}">📍 ${esc(L(at).name)}${L(at).type === 'estancia' ? ` · ${esc(L(L(at).parent).name)}` : ''}</button>` : ''}
      ${now(n).spot?.pin && route.map !== npcMap(n) ? `<button class="btn" data-act="showNpc">🗺 Ver en el plano</button>` : ''}</div>${editActions('npc', n)}
    ${!isTbd(now(n).doing) ? `<div class="doing"><h4>🎭 ${TIMES.find(t => t[0] === prefs.time)[1]} ${timeLabel(prefs.time)}${now(n).away ? ' · fuera del plano' : ''}</h4><span class="${now(n).away ? 'away' : ''}">${fmt(now(n).doing, n.id)}</span></div>` : ''}
    ${n.schedule ? `<div class="f"><h4>Rutina del día</h4><div style="font-size:13px">${TIMES.map(([k, ico, lb]) => { const s = k === 'tarde' ? { doing: n.doing } : n.schedule[k]; return s?.doing ? `<div style="margin-bottom:3px;${k === prefs.time ? 'color:var(--accent)' : ''}">${ico} <b>${lb}:</b> ${esc(s.doing)}</div>` : ''; }).join('')}</div></div>` : ''}
    ${!isTbd(n.quote) ? `<p class="quote">${fmt(n.quote, n.id)}</p>` : ''}
    ${field('npc', n, 'location')}${field('npc', n, 'look')}${field('npc', n, 'personality')}${field('npc', n, 'voice', 'voice')}
    ${field('npc', n, 'knows')}${field('npc', n, 'pcRel')}${field('npc', n, 'faction')}
    ${dmBox(field('npc', n, 'wants') + field('npc', n, 'secrets') + field('npc', n, 'npcRel'))}
    ${n.pc ? '' : missing('npc', n, ['look', 'personality', 'voice', 'wants', 'knows', 'secrets', 'quote'])}`;
}
function facCard(f) {
  return `<h2>⚑ ${esc(f.name)}</h2><div class="sub">Facción</div>${editActions('fac', f)}
    ${FAC_FIELDS.map(([k]) => field('fac', f, k)).join('')}${missing('fac', f, FAC_FIELDS.map(x => x[0]))}`;
}
function questCard(q) {
  return `<h2>📜 ${esc(q.name)}</h2><div class="tags">${!isTbd(q.status) ? `<span class="tag ${/complet/.test(q.status) ? 'ok' : ''}">${esc(q.status)}</span>` : ''}</div>${editActions('quest', q)}
    ${field('quest', q, 'giver')}${field('quest', q, 'where')}${field('quest', q, 'summary')}${dmBox(field('quest', q, 'dm'))}`;
}

function editForm(kind, o) {
  const fields = FIELDS[kind].filter(([k]) => kind !== 'loc' || o[k] !== undefined || !['tone', 'situation'].includes(k));
  let extra = '';
  if (kind === 'loc') {
    const opts = Object.values(db.locations).filter(l => !subtree(o.id).includes(l.id)).map(l => `<option value="${l.id}" ${l.id === o.parent ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
    extra = `<label>Tipo</label><input type="text" name="type" value="${esc(o.type)}">
      ${o.id !== 'mundo' ? `<label>Dentro de</label><select name="parent">${opts}</select>` : ''}
      <label>Mapa (ruta de imagen, p. ej. maps/ethar.png)</label><input type="text" name="map" value="${esc(o.map)}">
      <label>Imagen (p. ej. img/lugares/taberna.png)</label><input type="text" name="image" value="${esc(o.image)}">
      <div class="chk"><label><input type="checkbox" name="visited" ${o.visited ? 'checked' : ''}> Visitado</label><label><input type="checkbox" name="secret" ${o.secret ? 'checked' : ''}> Secreto</label></div>`;
  } else if (kind === 'npc') {
    extra = `<label>Retrato (p. ej. img/npcs/dory.png)</label><input type="text" name="image" value="${esc(o.image)}">
      <div class="chk"><label><input type="checkbox" name="pc" ${o.pc ? 'checked' : ''}> Personaje jugador</label><label><input type="checkbox" name="vecino" ${isVecino(o) ? 'checked' : ''}> Vecino (relleno)</label></div>`;
  }
  const val = k => kind === 'npc' && k === 'doing' ? now(o).doing : o[k];
  const lbl = (k, lb) => kind === 'npc' && k === 'doing' ? `${lb} (${timeLabel(prefs.time).toLowerCase()})` : lb;
  return `<form class="card form" id="editForm"><h2>Editar</h2>
    <label>Nombre</label><input type="text" name="name" value="${esc(o.name)}" required>${extra}
    ${fields.map(([k, lb]) => `<label>${lbl(k, lb)}</label><textarea name="${k}" rows="${['read', 'dm', 'secrets', 'knows'].includes(k) ? 5 : 2}">${esc(val(k) || '')}</textarea>`).join('')}
    <div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" data-act="cancel">Cancelar</button></div></form>`;
}
$('#detail').addEventListener('submit', e => {
  e.preventDefault();
  const o = current(), fd = new FormData(e.target);
  for (const [k, v] of fd.entries()) {
    if (k === 'vecino') continue;
    // lo que hace un NPC se guarda en la franja del día que se está viendo
    if (route.kind === 'npc' && k === 'doing' && prefs.time !== 'tarde') { ((o.schedule ??= {})[prefs.time] ??= {}).doing = v.trim(); continue; }
    o[k] = v.trim();
  }
  for (const k of ['visited', 'secret', 'pc']) if (e.target.elements[k]) o[k] = e.target.elements[k].checked;
  if (e.target.elements.vecino) { if (e.target.elements.vecino.checked) o.tier = 'vecino'; else delete o.tier; }
  for (const k of ['map', 'image']) if (o[k] === '') delete o[k];
  save(); aliasIndex = null; editing = false; renderAll(true);
});
$('#detail').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-dmtoggle]')) { prefs.dmClosed = !prefs.dmClosed; savePrefs(); renderDetail(); return; }
  if (t.matches('[data-zoom]')) { $('#lightbox img').src = t.src; $('#lightbox').classList.add('open'); return; }
  const c = t.closest('[data-npc],[data-loc]');
  if (c && !t.closest('[data-act]')) { c.dataset.npc ? go('npc', c.dataset.npc) : go('loc', c.dataset.loc); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const o = current();
  switch (a.dataset.act) {
    case 'enter': enter(o.id); break;
    case 'show': go('loc', o.id, mapForPin(o.id)); break;
    case 'goLoc': go('loc', a.dataset.id); break;
    case 'showNpc': go('npc', o.id, npcMap(o)); break;
    case 'edit': editing = true; renderDetail(); break;
    case 'cancel': editing = false; renderDetail(); break;
    case 'placeNpc': placing = { npc: o.id }; vp.classList.add('placing'); toast(`Haz clic en el plano para situar a <b>${esc(plainName(o.name))}</b> · Esc para cancelar`); break;
    case 'unplaceNpc':
      if (prefs.time === 'tarde') delete o.spot; else (o.schedule ??= {})[prefs.time] = { away: true, doing: now(o).doing };
      save(); renderAll(false); break;
    case 'place': placing = { loc: o.id }; if (route.map !== mapHost(o.parent)) go('loc', o.id, mapHost(o.parent)); vp.classList.add('placing'); toast(`Haz clic en el mapa para colocar <b>${esc(o.name)}</b> · Esc para cancelar`); break;
    case 'addChild': { const id = uniqueId(db.locations, 'nuevo-lugar'); db.locations[id] = { id, name: 'Nuevo lugar', type: 'zona', parent: o.id, visited: false, secret: false }; openNodes.add(o.id); save(); aliasIndex = null; editing = true; go('loc', id); break; }
    case 'addNpcHere': { const id = uniqueId(db.npcs, 'nuevo'); db.npcs[id] = { id, name: 'Nuevo NPC', location: o.name }; save(); aliasIndex = null; editing = true; go('npc', id); break; }
    case 'delete': {
      if (!confirm(`¿Borrar «${o.name}»? Se puede recuperar con «Restaurar datos del Word» o desde una copia exportada.`)) return;
      (db.deleted ??= []).push(o.id);
      if (route.kind === 'loc') { children(o.id).forEach(k => k.parent = o.parent); const p = o.parent; delete db.locations[o.id]; save(); aliasIndex = null; go('loc', p); }
      else { delete ({ npc: db.npcs, fac: db.factions, quest: db.quests })[route.kind][o.id]; save(); aliasIndex = null; go('loc', route.map || db.start); }
    }
  }
});
$('#lightbox').onclick = () => $('#lightbox').classList.remove('open');

/* ---------- Buscador (Ctrl+K) ---------- */
let results = [], active = 0;
function openSearch() { $('#searchOv').classList.add('open'); $('#searchIn').value = ''; runSearch(); $('#searchIn').focus(); }
function closeSearch() { $('#searchOv').classList.remove('open'); }
function runSearch() {
  const q = $('#searchIn').value.trim().toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const all = [
    ...Object.values(db.npcs).map(o => ({ kind: 'npc', o, k: o.pc ? 'PJ' : isVecino(o) ? 'Vecino' : isEnemy(o) ? 'Enemigo' : 'NPC', sub: o.role })),
    ...Object.values(db.locations).map(o => ({ kind: 'loc', o, k: 'Lugar', sub: o.type })),
    ...Object.values(db.factions).map(o => ({ kind: 'fac', o, k: 'Facción', sub: '' })),
    ...Object.values(db.quests).map(o => ({ kind: 'quest', o, k: 'Misión', sub: o.status }))];
  results = (q ? all.filter(r => norm(r.o.name).includes(q) || norm(r.sub).includes(q)).sort((a, b) => norm(a.o.name).indexOf(q) - norm(b.o.name).indexOf(q)) : all.filter(r => r.kind === 'npc')).slice(0, 40);
  active = 0; drawResults();
}
function drawResults() {
  $('#results').innerHTML = results.map((r, i) => `<div class="res ${i === active ? 'active' : ''}" data-i="${i}">${r.kind === 'npc' ? avatar(r.o) : `<span class="av">${r.kind === 'loc' ? typeIcon(r.o.type) : r.kind === 'fac' ? '⚑' : '📜'}</span>`}<div><b>${esc(r.o.name)}</b><div style="font-size:12px;color:var(--dim)">${esc(r.sub || '')}</div></div><span class="k">${r.k}</span></div>`).join('') || '<div class="empty">Sin resultados</div>';
  $('#results .active')?.scrollIntoView({ block: 'nearest' });
}
function pick(i) { const r = results[i]; if (!r) return; closeSearch(); go(r.kind, r.o.id); }
$('#openSearch').onclick = openSearch;
$('#searchIn').addEventListener('input', runSearch);
$('#searchIn').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { active = Math.min(active + 1, results.length - 1); drawResults(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); drawResults(); e.preventDefault(); }
  else if (e.key === 'Enter') pick(active);
});
$('#results').addEventListener('click', e => { const r = e.target.closest('[data-i]'); if (r) pick(+r.dataset.i); });
$('#searchOv').addEventListener('click', e => { if (e.target.id === 'searchOv') closeSearch(); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  else if (e.key === 'Escape') { closeSearch(); $('#lightbox').classList.remove('open'); if (placing) { placing = null; vp.classList.remove('placing'); hideToast(); } }
});

/* ---------- Cabecera ---------- */
function applyTheme() { document.documentElement.dataset.theme = prefs.theme; $('#themeToggle').textContent = prefs.theme === 'dark' ? '☀' : '☾'; }
$('#themeToggle').onclick = () => { prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); };
$('#editToggle').onclick = () => { editMode = !editMode; editing = false; $('#editToggle').classList.toggle('on', editMode); document.body.classList.toggle('edit', editMode); if (editMode) toast('Modo edición: arrastra los pins para moverlos y edita las fichas'); else hideToast(); renderList(); renderDetail(); };
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#menuList').classList.toggle('open'); };
document.addEventListener('click', () => $('#menuList').classList.remove('open'));
$('#menuList').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'export') {
    const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `othran-vel-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(a.href);
  } else if (act === 'import') $('#importFile').click();
  else if (act === 'reset' && confirm('Esto borra todos los cambios hechos en la app y vuelve a los datos del Word. ¿Seguro? (Exporta antes si quieres guardarlos)')) {
    localStorage.removeItem(STORE); db = structuredClone(window.SEED); aliasIndex = null; go('loc', db.start); renderAll(true);
  }
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.locations || !d.npcs) throw new Error('No parece una campaña'); db = d; save(); aliasIndex = null; go('loc', db.start); renderAll(true); }
  catch (err) { alert('No se pudo importar: ' + err.message); }
  e.target.value = '';
});

function renderAll(mapChanged) { renderList(); renderMap(mapChanged); renderDetail(); if (!mapChanged) focusSelected(true); }

$('#title').textContent = db.title; $('#group').textContent = db.group || ''; $('#logo').src = src(db.logo);
$('#labelsBtn').classList.toggle('on', prefs.labels);
$('#tokensBtn').classList.toggle('on', prefs.tokens !== false);
$('#vecinosBtn').classList.toggle('on', prefs.vecinos !== false);
renderTimes();
applyTheme();
route = parseHash();
renderAll(true);
</script>
</body>
</html>
