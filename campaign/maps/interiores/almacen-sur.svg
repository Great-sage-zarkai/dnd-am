<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720">
  <defs>
    <pattern id="wood" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#b48a5a"/>
      <path d="M0 19.5H40M0 9.5H40M14 0V10M32 10V20" stroke="#8f6a42" stroke-width="1"/>
    </pattern>
    <pattern id="planks" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#9b7650"/>
      <path d="M0.5 0V40M13.5 0V40M26.5 0V40M0 22H14M13 8H27M26 30H40" stroke="#6e5034" stroke-width="1.2"/>
    </pattern>
    <pattern id="stone" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#a59a88"/>
      <path d="M0 0.5H40M0.5 0V40M0 20.5H40M20.5 20V40" stroke="#857a69" stroke-width="1"/>
    </pattern>
    <pattern id="cobble" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#b3a68e"/>
      <g fill="#c3b79f" stroke="#8a7d66" stroke-width="1"><ellipse cx="10" cy="9" rx="8" ry="6"/><ellipse cx="29" cy="11" rx="9" ry="7"/><ellipse cx="9" cy="29" rx="7" ry="8"/><ellipse cx="28" cy="31" rx="9" ry="6"/></g>
    </pattern>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#8fa266"/>
      <path d="M6 10l2-5 2 5M24 22l2-5 2 5M12 32l2-5 2 5M32 6l2-5 2 5" stroke="#6f8549" stroke-width="1.2" fill="none"/>
    </pattern>
    <pattern id="dirt" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#b99a6c"/>
      <g fill="#a3855a"><circle cx="8" cy="12" r="1.5"/><circle cx="27" cy="7" r="1.2"/><circle cx="18" cy="28" r="1.6"/><circle cx="34" cy="33" r="1.2"/></g>
    </pattern>
    <pattern id="field" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#8a6d45"/>
      <path d="M0 10H40" stroke="#6f8549" stroke-width="5" stroke-dasharray="6 4"/>
    </pattern>
    <pattern id="water" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#5f8a94"/>
      <path d="M0 12q10-6 20 0t20 0M40 32q10-6 20 0t20 0" stroke="#86adb5" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a1d10" stroke-opacity=".42" stroke-width="1.2"/>
    </pattern>
    <radialGradient id="fire"><stop offset="0" stop-color="#ffe08a"/><stop offset=".6" stop-color="#f08a24"/><stop offset="1" stop-color="#a8321a"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe7a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/></radialGradient>
    <g id="chair"><circle r="7" fill="#6e4a28" stroke="#3b2a1a" stroke-width="1.5"/></g>
    <g id="table4">
      <use href="#chair" x="0" y="-34"/><use href="#chair" x="0" y="34"/><use href="#chair" x="-34" y="0"/><use href="#chair" x="34" y="0"/>
      <circle r="22" fill="#7a5230" stroke="#3b2a1a" stroke-width="2"/><circle r="9" fill="#e9d9a8" opacity=".5"/>
    </g>
    <g id="barrel"><circle r="15" fill="#7d5532" stroke="#3b2a1a" stroke-width="2"/><circle r="10" fill="none" stroke="#3b2a1a" stroke-width="1.5"/><circle r="3" fill="#3b2a1a"/></g>
    <g id="crate"><rect x="-17" y="-17" width="34" height="34" fill="#a57d4c" stroke="#3b2a1a" stroke-width="2"/><path d="M-17 -17L17 17M17 -17L-17 17" stroke="#6e4a28" stroke-width="2"/></g>
    <g id="sack"><ellipse rx="14" ry="10" fill="#c8b48a" stroke="#3b2a1a" stroke-width="1.5"/><path d="M-4 -9q4 -5 8 0" stroke="#3b2a1a" fill="none"/></g>
    <g id="bed"><rect width="36" height="72" rx="3" fill="#d8c7a0" stroke="#3b2a1a" stroke-width="2"/><rect x="5" y="5" width="26" height="14" rx="3" fill="#f3ead2" stroke="#3b2a1a"/><rect y="28" width="36" height="44" fill="#8a3b2e" opacity=".75"/></g>
    <g id="bunk"><rect width="36" height="72" rx="2" fill="#c9b892" stroke="#3b2a1a" stroke-width="2"/><rect x="5" y="5" width="26" height="12" rx="3" fill="#efe6cc" stroke="#3b2a1a"/><rect y="26" width="36" height="46" fill="#5b6a7a" opacity=".7"/><path d="M0 0L36 72M36 0L0 72" stroke="#3b2a1a" stroke-opacity=".25"/></g>
    <g id="bench"><rect x="-40" y="-8" width="80" height="16" rx="2" fill="#7a5230" stroke="#3b2a1a" stroke-width="2"/></g>
    <g id="candle"><circle r="9" fill="url(#glow)"/><circle r="3" fill="#f5e6b0" stroke="#3b2a1a"/></g>
    <g id="rack"><rect x="-40" y="-8" width="80" height="16" fill="#5a3a1e" stroke="#2a1a0c" stroke-width="2"/><path d="M-30 -8V8M-15 -8V8M0 -8V8M15 -8V8M30 -8V8" stroke="#b8b8b8" stroke-width="2"/></g>
    <g id="rackEmpty"><rect x="-40" y="-8" width="80" height="16" fill="#5a3a1e" stroke="#2a1a0c" stroke-width="2"/><path d="M-30 -8V8" stroke="#b8b8b8" stroke-width="2"/></g>
    <g id="shelf"><rect x="-40" y="-9" width="80" height="18" fill="#6e4a28" stroke="#3b2a1a" stroke-width="2"/><g fill="#c9b07a" stroke="#3b2a1a" stroke-width=".8"><rect x="-36" y="-6" width="10" height="12"/><circle cx="-16" cy="0" r="5"/><rect x="-6" y="-6" width="14" height="12"/><circle cx="16" cy="0" r="5"/><rect x="25" y="-6" width="10" height="12"/></g></g>
    <g id="books"><rect x="-40" y="-9" width="80" height="18" fill="#5a3a1e" stroke="#2a1a0c" stroke-width="2"/><path d="M-34 -6V6M-29 -6V6M-24 -6V6M-16 -6V6M-11 -6V6M-3 -6V6M4 -6V6M12 -6V6M19 -6V6M27 -6V6M33 -6V6" stroke="#c9a46a" stroke-width="3"/></g>
    <g id="desk"><rect x="-30" y="-18" width="60" height="36" fill="#7a5230" stroke="#3b2a1a" stroke-width="2"/><rect x="-18" y="-10" width="18" height="14" fill="#f3ead2" stroke="#3b2a1a" stroke-width=".8"/><circle cx="14" cy="-4" r="3" fill="#222"/><use href="#chair" x="0" y="30"/></g>
    <g id="chest"><rect x="-22" y="-13" width="44" height="26" rx="3" fill="#5a3a1e" stroke="#2a1a0c" stroke-width="2"/><path d="M-22 -2H22" stroke="#c9b07a" stroke-width="2"/><rect x="-3" y="-5" width="6" height="7" fill="#c9b07a"/></g>
    <g id="tree"><circle r="30" fill="#5c7a3c" stroke="#3d5527" stroke-width="2"/><circle cx="-10" cy="-8" r="14" fill="#6f8e4a"/><circle cx="10" cy="6" r="12" fill="#6f8e4a"/></g>
    <g id="bush"><circle r="14" fill="#6a8a44" stroke="#3d5527" stroke-width="1.5"/><circle cx="-4" cy="-4" r="6" fill="#7d9c55"/></g>
    <g id="boat"><path d="M-60 0Q-60 -16 -30 -18H50Q66 0 50 18H-30Q-60 16 -60 0Z" fill="#7a5230" stroke="#3b2a1a" stroke-width="2"/><path d="M-20 -17V17M14 -17V17" stroke="#3b2a1a" stroke-width="2"/></g>
    <g id="stall"><rect x="-40" y="-26" width="80" height="52" fill="#a57d4c" stroke="#3b2a1a" stroke-width="2"/><path d="M-40 -26H40V-6H-40Z" fill="#b5513a"/><path d="M-24 -26V-6M-8 -26V-6M8 -26V-6M24 -26V-6" stroke="#e8d6b0" stroke-width="6"/></g>
    <g id="dummy"><circle r="12" fill="#c8b48a" stroke="#3b2a1a" stroke-width="2"/><path d="M-20 0H20M0 -20V20" stroke="#6e4a28" stroke-width="4"/></g>

  </defs>
  <rect width="1000" height="720" fill="#e8dcbf"/>
  <rect x="8" y="8" width="984" height="704" fill="none" stroke="#7a5f3a" stroke-width="3"/>
<!--plan w=1000 h=720 tx=420 ty=620 title="Almacén Sur" sub="Nave del puerto · Ethar"-->
  <rect x="40" y="80" width="760" height="440" fill="url(#planks)"/>
  <rect x="600" y="80" width="200" height="120" fill="url(#stone)"/>
  <rect x="40" y="520" width="760" height="56" fill="url(#planks)" stroke="#3b2a1a" stroke-width="2"/>
  <rect x="40" y="80" width="760" height="440" fill="url(#grid)"/>
  <g fill="#3b2a1a"><circle cx="90" cy="560" r="8"/><circle cx="320" cy="560" r="8"/><circle cx="560" cy="560" r="8"/><circle cx="760" cy="560" r="8"/></g>
  <!-- filas de cajas -->
  <g>
    <use href="#crate" x="120" y="150"/><use href="#crate" x="156" y="150"/><use href="#crate" x="192" y="150"/><use href="#crate" x="264" y="150"/><use href="#crate" x="300" y="150"/><use href="#crate" x="336" y="150"/><use href="#crate" x="372" y="150"/>
    <use href="#crate" x="120" y="270"/><use href="#crate" x="156" y="270"/><use href="#crate" x="228" y="270"/><use href="#crate" x="264" y="270"/><use href="#crate" x="300" y="270"/><use href="#crate" x="372" y="270"/>
    <use href="#crate" x="120" y="306"/><use href="#crate" x="264" y="306"/><use href="#crate" x="372" y="306"/>
    <use href="#crate" x="120" y="420"/><use href="#crate" x="156" y="420"/><use href="#crate" x="192" y="420"/><use href="#crate" x="228" y="420"/><use href="#crate" x="300" y="420"/>
    <use href="#barrel" x="470" y="140"/><use href="#barrel" x="500" y="160"/><use href="#barrel" x="470" y="172"/>
    <use href="#sack" x="480" y="430"/><use href="#sack" x="508" y="444"/><use href="#sack" x="478" y="456"/>
  </g>
  <!-- cadáver semioculto entre las cajas -->
  <g transform="translate(320 352) rotate(-20)" opacity=".85">
    <ellipse rx="26" ry="10" fill="#d9cfb8" stroke="#3b2a1a" stroke-width="1.5"/><circle cx="-32" cy="0" r="8" fill="#c9b49a" stroke="#3b2a1a" stroke-width="1.5"/>
    <path d="M10 -6q4 6 0 12" stroke="#8a6238" fill="none" stroke-width="2"/>
  </g>
  <!-- mesa de recuento de Corvan -->
  <use href="#desk" x="590" y="300"/>
  <use href="#chest" x="680" y="292"/>
  <use href="#candle" x="560" y="292"/>
  <use href="#bench" x="600" y="410"/>
  <!-- antesala del fondo: escalera al sótano -->
  <g stroke="#3b2a1a" stroke-width="2"><rect x="700" y="96" width="84" height="88" fill="#8c8170"/><path d="M712 96V184M724 96V184M736 96V184M748 96V184M760 96V184M772 96V184"/></g>
  <path d="M770 140H712M722 130L712 140L722 150" stroke="#2a1a0c" stroke-width="2.5" fill="none"/>
  <use href="#crate" x="630" y="120"/>
  <!-- tranca de la puerta del fondo -->
  <rect x="664" y="206" width="72" height="10" fill="#4a2f18" stroke="#2a1a0c" stroke-width="2"/>

  <!-- muros -->
  <g stroke="#2a1a0c" stroke-width="12" stroke-linecap="square" fill="none">
    <path d="M40 80H800V520H520M360 520H40V340M40 300V80"/>
    <path d="M600 80V200H680M720 200H800"/>
  </g>
  <g stroke="#cfe3ea" stroke-width="6" stroke-opacity=".6"><path d="M800 300V360M200 80H260M400 80H460"/></g>
  <!-- puertas -->
  <g fill="none" stroke="#3b2a1a" stroke-width="2" stroke-dasharray="4 3">
    <path d="M360 520A80 80 0 0 1 440 520"/><path d="M520 520A80 80 0 0 0 440 520"/>
    <path d="M40 300A40 40 0 0 1 40 340"/><path d="M680 200A40 40 0 0 1 720 200"/>
  </g>

  <g font-family="Georgia, serif" fill="#3b2a1a">
    <text x="420" y="620" font-size="30" font-weight="bold" text-anchor="middle">Almacén Sur</text>
    <text x="420" y="646" font-size="15" font-style="italic" text-anchor="middle">Nave del puerto · Ethar</text>
    <path d="M320 676H520" stroke="#3b2a1a" stroke-width="2"/>
    <path d="M320 670V682M360 670V682M400 670V682M440 670V682M480 670V682M520 670V682" stroke="#3b2a1a" stroke-width="2"/>
    <text x="420" y="702" font-size="13" text-anchor="middle">1 cuadro = 5 pies (1,5 m)</text>
  </g>
  <g transform="translate(940 660)" stroke="#3b2a1a" stroke-width="1.5">
    <path d="M0 -30L7 0L0 30L-7 0Z" fill="#e8dcbf"/><path d="M0 -30L7 0H-7Z" fill="#3b2a1a"/>
    <text y="-36" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#3b2a1a" stroke="none">N</text>
  </g>
</svg>